services:
  postgres:
    image: postgres:16-alpine
    container_name: robinhood_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot_password
      POSTGRES_DB: robinhood_bot
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Localhost ONLY — the VPS has no firewall rule for 5432.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d robinhood_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: robinhood_bot_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    ports:
      # Localhost ONLY — Redis runs without a password; public exposure would let
      # anyone forge events:approved, poison cache:eth_usd or drop the buy locks.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  bot:
    build: .
    container_name: robinhood_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override the localhost URLs from .env so the container reaches Postgres/Redis
      # over the compose network (by service name). Everything else comes from .env.
      DATABASE_URL: postgresql://bot:bot_password@postgres:5432/robinhood_bot
      REDIS_URL: redis://redis:6379
    ports:
      # Dashboard — bound to localhost ONLY. Reach it via SSH tunnel
      # (ssh -L 3000:localhost:3000 user@vps). Never expose it publicly.
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  redis_data:
